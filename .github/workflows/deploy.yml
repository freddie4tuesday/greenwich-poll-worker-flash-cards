# Every push to main runs both test suites and, only if they pass, deploys the Worker (owner's request, 2026-10-02: merging to main goes live).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions). The Resend key is already a secret on the
# Worker itself, so it is not needed here. Tests use a local copy only and never touch the live site or its data.
name: Test and deploy
on:
  push:
    branches: [main]
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node tests/ui.mjs
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
