<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4433">
<title>Poll Worker Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=EB+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand colors from the Greenwich ROV brand identity guide; fixed in light and dark mode */
  --green:#1f4433; --gold:#b99c35; --white:#FFFFFF; --text-dark:#111111;
  --page:#EEF1EC; --ink:#1A2A20; --muted:#5D6B62; --rule:#CCD5CD; --panel:#FFFFFF; --red:#A8392D;
  --sans:"Lato", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --accent:"EB Garamond", Garamond, Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0F1612; --ink:#E4EBE6; --muted:#9FB0A5; --rule:#2A3A30; --panel:#18221C; --red:#E07A6E; }
}
:root[data-theme="dark"]{ --page:#0F1612; --ink:#E4EBE6; --muted:#9FB0A5; --rule:#2A3A30; --panel:#18221C; --red:#E07A6E; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- One-screen phone layout ---------- */
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:6px max(14px, env(safe-area-inset-right,0px)) 10px max(14px, env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:8px;min-height:44px;flex:none}
.top h1{flex:1;font-size:1rem;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:10px;cursor:pointer;
  display:grid;place-items:center;margin-right:-8px}
.icon-btn svg{width:24px;height:24px}
.track{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;flex:none}
.track span{display:block;height:100%;width:0;background:var(--gold);transition:width .3s ease}

#play{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center;padding:12px 0;perspective:1400px}
.status{color:var(--muted);text-align:center;padding:0 20px}

/* ---------- Card, at the Canva page ratio 240 x 336, as large as the screen allows ---------- */
.card{position:relative;width:min(100cqw, calc(100cqh * 240 / 336));aspect-ratio:240/336;cursor:pointer;outline:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.card:focus-visible .flipper{box-shadow:0 0 0 4px var(--gold)}
.drag{position:absolute;inset:0;will-change:transform}
.flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.25,1);border-radius:12px}
.card.flipped .flipper{transform:rotateY(180deg)}
.flipper.instant{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;
  container-type:inline-size;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(16,40,28,.22),0 2px 6px rgba(16,40,28,.18)}
.face.back{transform:rotateY(180deg)}
.front{background:var(--green);color:var(--white)}
.front .qwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10cqw 9cqw 0;overflow:hidden}
.front .q{font-size:8.6cqw;line-height:1.3;text-align:center;margin:0}
.front .tap{text-align:center;font-size:4.4cqw;color:rgba(255,255,255,.72);margin:0 0 3cqw}
.band-q{background:var(--green);color:var(--white);height:31%;display:flex;align-items:center;justify-content:center;padding:4cqw 7cqw;overflow:hidden;flex:none}
.band-q p{font-size:7.2cqw;line-height:1.3;text-align:center;margin:0}
.band-a{background:var(--white);color:var(--text-dark);flex:1;display:flex;align-items:center;justify-content:center;padding:6cqw 8cqw;overflow:hidden}
.band-a p{font-size:7.2cqw;line-height:1.35;text-align:center;margin:0;white-space:pre-line}
/* Approved logo artwork, never redrawn: white version on green */
.band-mark{background:var(--green);height:27%;display:flex;align-items:center;justify-content:center;flex:none}
.front .band-mark{height:25%}
.band-mark img{display:block;width:88%;height:auto;pointer-events:none;-webkit-user-drag:none}
.stamp{position:absolute;top:7%;padding:1.5cqw 3.5cqw;border:.9cqw solid;border-radius:2cqw;font-weight:700;font-size:5.5cqw;
  background:rgba(255,255,255,.92);opacity:0;pointer-events:none;z-index:2;container-type:normal}
.stamp.knew{left:6%;color:var(--green);transform:rotate(-12deg)}
.stamp.again{right:6%;color:#A8392D;transform:rotate(12deg)}

/* ---------- Grading: ballot ovals sized for thumbs ---------- */
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.vote button{font-weight:700;font-size:1.02rem;background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  min-height:60px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:opacity .2s}
.vote button:disabled{opacity:.4;cursor:default}
.oval{flex:none;width:30px;height:16px;border:2px solid var(--ink);border-radius:50%;transition:background .15s,border-color .15s}
.vote .knew.marked .oval{background:var(--green);border-color:var(--green)}
.vote .again.marked .oval{background:var(--red);border-color:var(--red)}
@media (hover:hover){
  .vote .knew:not(:disabled):hover .oval{background:var(--green);border-color:var(--green)}
  .vote .again:not(:disabled):hover .oval{background:var(--red);border-color:var(--red)}
}
.hint{text-align:center;color:var(--muted);font-size:.82rem;margin:6px 0 0;min-height:1.2em;flex:none}

/* Between cards */
.card.leave-right .drag{animation:leaveR .3s ease-in forwards}
.card.leave-left .drag{animation:leaveL .3s ease-in forwards}
.card.enter .drag{animation:enter .32s ease-out}
@keyframes leaveR{to{transform:translateX(120%) rotate(14deg);opacity:0}}
@keyframes leaveL{to{transform:translateX(-120%) rotate(-14deg);opacity:0}}
@keyframes enter{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* ---------- Round summary ---------- */
#summary{display:none;flex:1;min-height:0;overflow-y:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch}
.sum-card{background:var(--green);color:var(--white);border-radius:12px;padding:24px 20px;box-shadow:0 10px 28px rgba(16,40,28,.22)}
.sum-card h2{font-family:var(--accent);font-weight:600;font-size:1.7rem;margin:0 0 4px}
.sum-card p{margin:0 0 14px;color:rgba(255,255,255,.85)}
.tally{display:flex;gap:28px;margin:4px 0 16px;font-variant-numeric:tabular-nums}
.tally div{font-size:.88rem;color:rgba(255,255,255,.85)}
.tally strong{display:block;font-size:2.1rem;color:var(--white);line-height:1.1}
.missed{margin:0 0 18px;padding-left:1.2em;font-size:.95rem}
.missed li{margin-bottom:6px}
.sum-card .row{display:flex;flex-direction:column;gap:10px}
.sum-card button{min-height:50px;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--white);cursor:pointer;font-weight:700}
.sum-card button.primary{background:var(--gold);border-color:var(--gold);color:#1B1B12}
.thanks{margin:20px 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.25);font-size:.92rem}
.sig{display:flex;justify-content:space-between;margin-top:8px;font-size:.92rem;color:rgba(255,255,255,.85)}
.sum-logo{display:block;width:72%;max-width:260px;height:auto;margin:22px auto 0}

/* ---------- Menu sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,16,12,.45);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:16px 16px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;
  transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:4px auto 10px}
.sheet button{display:block;width:100%;text-align:left;min-height:52px;padding:0 6px;border:0;border-bottom:1px solid var(--rule);
  background:transparent;font-size:1.02rem;cursor:pointer}
.sheet button:last-child{border-bottom:0;color:var(--muted)}
.sheet .note{color:var(--muted);font-size:.82rem;padding:10px 6px 0;margin:0}


@media (prefers-reduced-motion: reduce){
  .flipper,.sheet,.track span{transition:none}
  .card .face{transition:opacity .25s}
  .card.flipped .face.front{opacity:0}
  .card:not(.flipped) .face.back{opacity:0}
  .card.leave-right .drag,.card.leave-left .drag,.card.enter .drag{animation:none}
}
</style>
</head>

<script>
const CARDS = [
["Who is the most important person at the election?","The voter. Everything is based on providing the registered voter with the best possible experience."],
["What are the official hours of voting on election day?","On election day all polling places are open from 6AM to 8PM."],
["Who must be sworn in by the Moderator before starting work?","All election officials must be sworn in prior to the start of the election."],
["Can a poll worker wear a t-shirt or pin supporting a candidate?","No. Poll workers must remain non-partisan and cannot wear or display any political materials."],
["What does the \"75-foot sign\" signify?","The boundary within which no campaigning or political discussion is allowed. It is measured in an arc from the exterior polling place doors."],
["Who is allowed inside the polling place?","Voters who are voting, members of the press, election officials, credentialed representatives from the Secretary of the State and individuals assisting a voter."],
["What is the IVS system?","The Inspire Voting System is the accessible ballot marking device available for any voter who wishes to use it."],
["Can a child enter the voting booth with a parent?","Yes, a child may accompany a parent into the voting booth. The parent, however, must insert their own ballot in the tabulator."],
["What is Same Day Registration (SDR)?","The process that allows an unregistered voter to register and vote at a designated SDR location (Town Hall). Voters who are not registered MUST come to Town Hall to take advantage of this."],
["What must be displayed on a wall for all voters to see?","A sample ballot and six large informational posters, including the \"Voters Bill of Rights.\""],
["What is the purpose of the Moderator's Diary?","To record any unusual occurrences, from machine jams to disruptive voters, to help improve future elections."],
["If a voter needs assistance due to a disability or language barrier, what is the procedure?","Notify the Moderator. Two election officials of differing parties will assist the voter."],
["What are the acceptable forms of ID a voter can present?","A pre-printed ID with their name and address; name and signature; OR name and photograph."],
["A voter is on the Active list but has no ID. What is the procedure?","The voter must sign the Form \"Signatory Affidavit for Voters Who Do Not Present ID.\""],
["A voter is on the Inactive List. What must they do to be restored and vote?","They must show a current and valid ID, and complete a new voter registration card."],
["What does the letter \"A\" in red or blue next to a voter's name signify?","The voter has already cast an Absentee Ballot. This voter cannot vote in person."],
["At the polls, a voter needs to change their address within Greenwich. What do you do?","Direct them to the Assistant Registrar or the Moderator, who will have them complete a new voter registration card."],
["What do you write next to the name of a voter who casts a Provisional Ballot?","\"PB\" Do NOT cross out the name."],
["What do you write next to the name of a voter who casts a Challenge Ballot?","\"CB\" Do NOT cross out the name."],
["A voter presents a State of CT Confidentiality Card. Where is their name found?","On the last page of the Official Checker book. You must not ask for their address."],
["What is the purpose of the tally sheet at the checker's table?","To make a hash mark for every voter processed, which is used for the hourly count reconciliation."],
["What is the Supplemental List?","A list of voters who have registered or made changes to their registration close to Election Day, after the main registry list was printed."],
["If a voter provides a driver's license with an old address, is it valid?","Yes, ID does not need to have the voter's current address. At the polling place ID is used to verify identity, not residency."],
["A voter has moved from another town in CT and is not on your list. What should you do?","Direct them to Town Hall for Same Day Registration (SDR)."],
["Who is responsible for placing the blue \"A\"s next to the names of absentee voters?","The Moderator will periodically instruct the Official Checker to do this based on updates from the Registrars of Voters."],
["What must a Ballot Clerk give to every voter along with their ballot?","A privacy sleeve. Please check to make sure the sleeve is empty."],
["What is a \"spoiled\" ballot?","A ballot that a voter makes a mistake on and returns to the Ballot Clerk to be replaced with a fresh ballot."],
["How many replacement ballots can a single voter receive?","A voter can receive as many replacements as they need."],
["What must the Ballot Clerk do with a spoiled ballot?","Place it in the \"Spoiled Ballot Envelope\" and record it on the appropriate tally sheet."],
["How does the ballot clerk keep track of the number of ballots issued?","By using a tally sheet, making a hash mark for every ballot given to a voter."],
["What should the Ballot Clerk do with the tally sheet at the end of the night?","Total the number of ballots issued and give the sheet to the Moderator as part of the closing reconciliation."],
["A ballot jams, but the screen shows a GREEN checkmark. Has the ballot been counted?","Yes. The vote was successfully counted. Call the Moderator to clear the jam."],
["A ballot jams, but the screen shows a RED X. Has the ballot been counted?","No. The vote was NOT counted. Call the Moderator immediately."],
["How far away should the tabulator tender stand from the tabulator?","At least 4 feet away to protect voter privacy."],
["What should the tabulator tender do with used privacy sleeves?","Periodically collect them and return them to the ballot clerk's table. Make certain they are EMPTY."],
["What is the most important rule for a tabulator tender regarding a voter's ballot?","Never look at it. The voter's right to a secret ballot is paramount."],
["If the tabulator screen displays a message you don't understand, what should you do?","Call the Moderator immediately."],
["When can you leave your station unattended?","Never. You may leave your station only when you have been relieved for a break by another election official."],
["What is the Moderator's ultimate responsibility at the polling place?","To ensure the election is conducted fairly, efficiently, and in accordance with all state laws and procedures."],
["What must be verified before cutting the seals on the Big Blue Bin?","The seal numbers must match the numbers on the Certificate for Opening of the Polls in the Moderator Return."],
["How many copies of the results tape are printed at the end of the night, and where do they go?","Three copies. One is returned to the ROVs, one is posted on the wall for the public, and one is placed inside the used ballot bag."],
["How many copies of the zero tape are printed in the morning, and where do they go?","Three copies. One is returned to the ROVs, one is posted on the wall for the public, and one is placed inside the used ballot bag."],
["What is the process for a hand count of ballots from the auxiliary bin?","The count must be done by two officials of different parties, and the results recorded on the Hand Count Tally Sheet."],
["If the tabulator malfunctions, who must be called immediately?","The Registrar of Voters' office. We will send out an additional tabulator to replace malfunctioning equipment."],
["What is the role of the Special Assistant Registrar (SAR)?","The SAR is to assist the Moderator with the setup of the tabulators and the IVS system. At night they will assist with packing up the equipment."],
["Who is ultimately in charge of the polling place and has the final say on all procedural decisions?","The Moderator."],
["How many days of early voting are there for a November election?","There are 14 consecutive days ending on the Sunday before Election Day."],
["How many days of early voting are there for a party primary?","There are 7 consecutive days ending on the Sunday before the Primary."],
["What are the rules for press who want to enter a polling place?","The Moderator may grant permission, but they are not allowed to record a voter's marked ballot or disrupt the voting process."],
["What is the purpose of the IVS Startup Report that is printed in the morning?","It verifies that the accessible voting machine has been set up correctly. It must be signed by the SAR and Moderator."],
["A voter wants to cast a \"write-in\" vote. Where do they write the name of the candidate?","The voter writes the name on the write-in line and fills in the oval. The name must appear under the specific office for which the candidate is running."],
["During the hourly count, what numbers must be reconciled?","The public counter on the tabulator, the official checker's tally sheet, and the ballot clerk's tally sheet should all match."]
];

const $ = id => document.getElementById(id);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const BUILTIN = CARDS.map((c,i) => ({ id:'c' + String(i+1).padStart(3,'0'), q:c[0], a:c[1], order:i+1 }));
const MAXQ = 200, MAXA = 400;

let deck = new Map();
let queue = [], firstTry = new Set(), missed = new Set(), roundSize = 0, done = 0;
let flipped = false, current = null, busy = false, started = false;

function setDeck(list){ deck = new Map(list.map(c => [c.id, c])); }
function ordered(){ return [...deck.values()].sort((x,y) => x.order - y.order); }
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* Shrink text until it fits its band, as the printed cards size long answers down. Returns smallest scale used. */
function fitIn(root){
  let worst = 1;
  root.querySelectorAll('.fit').forEach(el => {
    el.style.fontSize = '';
    const box = el.parentElement;
    const base = parseFloat(getComputedStyle(el).fontSize);
    if(!base) return;
    let size = base, guard = 0;
    while((box.scrollHeight > box.clientHeight + 1 || el.scrollWidth > box.clientWidth + 1) && size > base * 0.5 && guard++ < 50){
      size -= base * 0.025; el.style.fontSize = size + 'px';
    }
    worst = Math.min(worst, size / base);
  });
  return worst;
}

/* ---------------- Game ---------------- */
function start(ids, doShuffle){
  closeMenu();
  queue = doShuffle ? shuffle(ids) : ids.slice();
  roundSize = queue.length; done = 0; firstTry = new Set(); missed = new Set();
  $('play').style.display = 'flex'; $('summary').style.display = 'none';
  show();
}
function startOnce(){
  if(started) return; started = true;
  $('status').hidden = true; $('card').hidden = false;
  start(ordered().map(c => c.id), true);
}

function show(){
  while(queue.length && !deck.has(queue[0])){ queue.shift(); roundSize = Math.max(done, roundSize - 1); }
  if(!queue.length) return finish();
  current = queue[0]; flipped = false;
  const fl = $('flipper'), card = $('card'), drag = $('drag');
  fl.classList.add('instant');
  card.classList.remove('flipped','leave-left','leave-right');
  drag.style.transform = ''; $('stampKnew').style.opacity = 0; $('stampAgain').style.opacity = 0;
  void fl.offsetWidth;
  fl.classList.remove('instant');
  paint();
  $('knew').disabled = $('again').disabled = true;
  $('knew').classList.remove('marked'); $('again').classList.remove('marked');
  $('hint').textContent = 'Tap the card to see the answer';
  if(!reduce){ card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter'); }
  busy = false;
  update();
}
function paint(){
  const c = deck.get(current); if(!c) return;
  $('fq').textContent = c.q; $('bq').textContent = c.q; $('ba').textContent = c.a;
  $('card').setAttribute('aria-label', flipped ? 'Answer: ' + c.a : 'Question: ' + c.q + ' Press to turn the card over.');
  fitIn($('card'));
}
function flip(){
  if(busy || current === null) return;
  flipped = !flipped;
  $('card').classList.toggle('flipped', flipped);
  $('faceFront').setAttribute('aria-hidden', String(flipped)); $('faceBack').setAttribute('aria-hidden', String(!flipped));
  if(flipped){
    $('knew').disabled = $('again').disabled = false;
    $('hint').textContent = 'Swipe right if you knew it, left to review';
  } else {
    $('hint').textContent = 'Tap the card to see the answer';
  }
  $('card').setAttribute('aria-label', flipped ? 'Answer: ' + deck.get(current).a : 'Question: ' + deck.get(current).q);
}
function grade(knew){
  if(busy || !flipped) return;
  busy = true;
  (knew ? $('knew') : $('again')).classList.add('marked');
  queue.shift();
  if(knew){ if(!missed.has(current)) firstTry.add(current); done++; }
  else {
    missed.add(current);
    queue.splice(Math.min(queue.length, 3 + Math.floor(Math.random()*3)), 0, current);
  }
  update();
  if(reduce){ setTimeout(show, 150); return; }
  $('card').classList.remove('enter');
  $('card').classList.add(knew ? 'leave-right' : 'leave-left');
  setTimeout(show, 300);
}
function update(){
  $('count').textContent = done + ' of ' + roundSize;
  $('bar').style.width = (roundSize ? (done/roundSize*100) : 0) + '%';
}
function finish(){
  update(); current = null;
  $('play').style.display = 'none'; $('summary').style.display = 'block'; $('summary').scrollTop = 0;
  $('sKnew').textContent = firstTry.size; $('sMissed').textContent = missed.size;
  const list = $('missedList'); list.innerHTML = '';
  [...missed].forEach(id => { const c = deck.get(id); if(!c) return; const li = document.createElement('li'); li.textContent = c.q; list.appendChild(li); });
  const any = missed.size > 0;
  $('sumTitle').textContent = any ? 'Round complete' : 'Clean sweep';
  $('sumNote').textContent = any ? 'These are the cards you marked for review at least once.' : 'You knew every card on the first try.';
  $('drill').style.display = any ? '' : 'none';
  (any ? $('drill') : $('again2')).focus();
}

/* Tap to flip; once flipped, drag the card sideways to grade it */
(function gestures(){
  const card = $('card'), drag = $('drag');
  let x0 = 0, y0 = 0, dx = 0, down = false, moved = false, id = null;
  card.addEventListener('pointerdown', e => {
    if(busy) return;
    down = true; moved = false; dx = 0; x0 = e.clientX; y0 = e.clientY; id = e.pointerId;
    try{ card.setPointerCapture(id); }catch(_){}
  });
  card.addEventListener('pointermove', e => {
    if(!down) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if(!moved && Math.hypot(mx,my) > 10) moved = true;
    if(!moved || !flipped) return;
    dx = mx;
    drag.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx/22) + 'deg)';
    const p = Math.min(1, Math.abs(dx) / (card.clientWidth * 0.3));
    $('stampKnew').style.opacity = dx > 0 ? p : 0; $('stampAgain').style.opacity = dx < 0 ? p : 0;
  });
  const end = () => {
    if(!down) return; down = false;
    if(!moved){ flip(); return; }
    if(!flipped) return;
    if(Math.abs(dx) > card.clientWidth * 0.28){ grade(dx > 0); }
    else {
      drag.style.transition = 'transform .2s ease'; drag.style.transform = '';
      $('stampKnew').style.opacity = 0; $('stampAgain').style.opacity = 0;
      setTimeout(() => { drag.style.transition = ''; }, 220);
    }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', () => { down = false; drag.style.transform = ''; $('stampKnew').style.opacity = 0; $('stampAgain').style.opacity = 0; });
  card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); flip(); }});
})();

$('knew').addEventListener('click', () => grade(true));
$('again').addEventListener('click', () => grade(false));
$('again2').addEventListener('click', () => start(ordered().map(c => c.id), true));
$('drill').addEventListener('click', () => start([...missed], true));
document.addEventListener('keydown', e => {
  if($('sheet').classList.contains('open')) return;
  if($('play').style.display === 'none' || e.target.tagName === 'BUTTON') return;
  const k = e.key.toLowerCase();
  if(k===' ' || k==='enter'){ e.preventDefault(); flip(); }
  else if(flipped && (k==='k' || e.key==='ArrowRight')) grade(true);
  else if(flipped && (k==='r' || e.key==='ArrowLeft')) grade(false);
});
window.addEventListener('resize', () => { clearTimeout(window._ft); window._ft = setTimeout(() => fitIn($('card')), 120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitIn($('card')));

/* ---------------- Menu ---------------- */
function openMenu(){ $('scrim').classList.add('open'); $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden','false'); $('mShuffle').focus(); }
function closeMenu(){ $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden','true'); }
$('menuBtn').addEventListener('click', openMenu);
$('scrim').addEventListener('click', closeMenu);
$('mClose').addEventListener('click', closeMenu);
$('mShuffle').addEventListener('click', () => start(ordered().map(c => c.id), true));
$('mOrder').addEventListener('click', () => start(ordered().map(c => c.id), false));

/* ---------------- Card data: the saved deck, edited on /edit ---------------- */
/* Build 1 (hosted): this used to read the deck from the claude.ai artifact database, which only exists inside claude.ai. The deck is now
   fetched from /api/deck. If that fails or takes over 5 seconds, the 52 built-in cards are played, so the game never shows an empty screen.
   With ?preview in the address, the page is the editor's preview window: it plays the deck the editor sends it, saved or not. */
setDeck(BUILTIN);
const PREVIEW = new URLSearchParams(location.search).has('preview');
const fallback = PREVIEW ? 0 : setTimeout(startOnce, 5000);

function liveDeckArrived(list){
  setDeck(list);
  if(!started){ clearTimeout(fallback); startOnce(); return; }
  if(current !== null){
    if(!deck.has(current)){ queue.shift(); show(); } else paint();
  }
}
function cleanCards(cards){
  if(!Array.isArray(cards)) return [];
  return cards.map(x => ({ id:String(x && x.id || ''), q:String(x && x.q || '').trim(), a:String(x && x.a || '').trim(), order:Number(x && x.order) || 0 }))
    .filter(c => c.id && c.q && c.a);
}

if(PREVIEW){
  $('mManage').hidden = true;
  $('status').textContent = 'Loading the preview…';
  window.addEventListener('message', e => {
    if(e.origin !== location.origin || !e.data || e.data.type !== 'deck') return;
    const list = cleanCards(e.data.cards);
    if(!list.length){ $('status').textContent = 'There are no cards to preview.'; return; }
    liveDeckArrived(list);
    if(started) start(ordered().map(c => c.id), !!e.data.shuffle);
  });
  if(window.parent !== window) window.parent.postMessage({ type:'ready' }, location.origin);
} else {
  fetch('/api/deck', { cache:'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('deck ' + r.status)))
    .then(d => { const list = cleanCards(d && d.content && d.content.cards); if(list.length) liveDeckArrived(list); else { clearTimeout(fallback); startOnce(); } })
    .catch(() => { clearTimeout(fallback); startOnce(); });
}
$('mManage').addEventListener('click', () => { location.href = '/edit'; });

</script>
